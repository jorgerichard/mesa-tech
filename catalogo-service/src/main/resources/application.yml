server:
  port: 8082
spring:
  application:
    name: catalogo-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mesatech_catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mesatech}
    password: ${RABBITMQ_PASSWORD:mesatech123}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:mesatech.exchange}
    queue: ${RABBITMQ_QUEUE:solicitudes.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:solicitud.creada}
