server:
  port: 8082
spring:
  application:
    name: catalogo-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mesatech_catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  rabbitmq:
    confirm-timeout: 10s
    legacy-solicitud:
      enabled: ${SOLICITUD_RABBITMQ_ENABLED:false}
      exchange: ${SOLICITUD_RABBITMQ_EXCHANGE:mesatech.exchange}
      routing-key: ${SOLICITUD_RABBITMQ_ROUTING_KEY:solicitud.creada}
