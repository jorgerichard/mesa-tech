server:
  port: 8081
spring:
  application:
    name: solicitudes-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mesatech_solicitudes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
