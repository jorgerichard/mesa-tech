server:
  port: 8081
spring:
  application:
    name: solicitudes-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mesatech_solicitudes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:mesatech}
    username: ${RABBITMQ_USER:solicitudes_consumidor}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: true
app:
  rabbitmq:
    queue: ${RABBITMQ_QUEUE:solicitudes.catalogo.queue}
