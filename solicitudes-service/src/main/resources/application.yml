server:
  port: 8081
spring:
  application:
    name: solicitudes-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mesatech_solicitudes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mesatech}
    password: ${RABBITMQ_PASSWORD:mesatech123}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:mesatech.exchange}
    queue: ${RABBITMQ_QUEUE:solicitudes.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:solicitud.creada}
